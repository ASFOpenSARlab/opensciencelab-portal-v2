---
name: Document CDK Diff for pull request
on: # yamllint disable-line rule:truthy
  workflow_dispatch: {}
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, review_requested]
    branches:
      - main

permissions:
   contents: read

jobs:
  setup:
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-setup-env.yaml@v1.2.1
    with:
      tagname: ${{ github.base_ref }} # This should be the target of the PR

  cdk-diff:
    runs-on: ubuntu-latest
    needs:
      - setup
    environment: ${{ needs.setup.outputs.environment }}
    container: ghcr.io/asfopensarlab/osl-utils:v1.2.1
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
    env:
      DEPLOY_PREFIX: ${{ needs.setup.outputs.deploy_prefix }}
      SES_EMAIL: ${{ secrets.SES_EMAIL }}
      SES_DOMAIN: ${{ vars.SES_DOMAIN }}
      SSL_CERT_ARN: ${{ vars.SSL_CERT_ARN }}
      DEPLOY_DOMAINS: ${{ vars.DEPLOY_DOMAINS }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      CALENDAR_URL: ${{ vars.CALENDAR_URL }}
      RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
      RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
      RECAPTCHA_THRESHOLD: ${{ vars.RECAPTCHA_THRESHOLD }}
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_NUMBER }}:role/deploy_portal_stack_role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Run Diff
        run: |-
          make synth-portal
          cd portal-cdk
          cdk diff 2>&1 | tee cdk-diff-output.log

      - name: Upload Diff Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cdk-diff-artifact
          path: cdk-diff-output.log
          retention-days: 10

  # Run as a separate job so token permissions don't propagate
  comment-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs:
      - setup
      - cdk-diff
    steps:

      - name: Download Diff Artifact
        uses: actions/download-artifact@v8
        with:
          name: cdk-diff-artifact

      - name: Comment CDK Diff Output on PR
        uses: towardsthecloud/aws-cdk-diff-pr-commenter@v1
        with:
          diff-file: cdk-diff-output.log
